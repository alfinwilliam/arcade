<!doctype html>
<!-- This page is shown for any missing address under the site, at any depth. So it cannot
     use relative links to the shared files, and carries its own few lines of style.
     data-ready is set here by hand because this page does not load shared/shell.js. -->
<html lang="en" data-ready="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Arcade</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #e6ecfa;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    h1 { margin: 0; font: 700 72px/1 ui-monospace, monospace; color: #6cb4ff; }
    p { margin: 12px 0; }
    a { display: inline-block; padding: 10px 16px; border: 1px solid #2f3b66; border-radius: 10px; color: #e6ecfa; text-decoration: none; }
    a:hover, a:focus-visible { border-color: #6cb4ff; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page is not here.</p>
    <p><a id="home" href="./">Back to the arcade</a></p>
  </main>
  <script>
    // The site lives in the first folder of the address (/arcade/ on GitHub Pages), so link there.
    var first = location.pathname.split('/')[1];
    document.getElementById('home').href = first ? '/' + first + '/' : '/';
  </script>
</body>
</html>
