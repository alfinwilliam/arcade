# Check the site, then publish the site/ folder to GitHub Pages.
# README.md explains every block of this file.

name: Check and deploy

on:
  push:
    branches: [main]      # every push to main publishes, if the checks pass
  workflow_dispatch:      # and you can start it by hand from the Actions tab

# If two pushes land close together, finish the first deploy before starting the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # this job only reads the code
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint (structure, relative URLs, example values only)
        run: python3 scripts/arcade.py lint

      - name: Logic tests (replays every level's reference solution)
        run: node tests/run-node.mjs

      - name: Package site/ for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: check          # runs only if every step above passed
    runs-on: ubuntu-latest
    permissions:
      pages: write        # may publish to Pages
      id-token: write     # proves to Pages that this run is who it says it is
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
